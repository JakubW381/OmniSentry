server:
  port: 8081
spring:
  main:
    allow-bean-definition-overriding: true
    web-application-type: servlet
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  grpc:
    client:
      channels:
        user-service:
          address: "static://os-backend:9092"
          negotiation-strategy: plaintext

app:
  rsa:
    public-key: ${OMNISENTRY_RSA_PUBLIC_KEY}
    private-key: ${OMNISENTRY_RSA_PRIVATE_KEY}