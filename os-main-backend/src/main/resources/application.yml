server:
  port: 8082

spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  grpc:
    server:
      port: 9092

app:
  salt-edge:
    app-id: ${APP_ID}
    secret: ${SECRET}
    base-url: ${SALT_URL}

logging:
  level:
    org:
      springframework:
        web:
          reactive:
            function:
              client:
                WebClient: TRACE
    reactor:
      netty:
        http:
          client:
            HttpClient: TRACE
        tcp:
          TcpClient: TRACE


management:
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://jaeger:4317
          transport: grpc
    resource-attributes:
      service.name: os-main-backend
  otlp:
    metrics:
      export:
        enabled: false