server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  grpc:
    server:
      port: 9092

app:
  salt-edge:
    app-id: ${APP_ID}
    secret: ${SECRET}